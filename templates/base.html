<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --white: #ffffff;
            --border: #e0e0e0;
            --success: #4cc9f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg);
            color: var(--text);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: var(--white);
            border-right: 1px solid var(--border);
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .nav-links {
            list-style: none;
            padding: 20px 0;
            margin: 0;
        }

        .nav-links li a {
            padding: 12px 25px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .nav-links li a:hover {
            background: #f0f2ff;
            color: var(--primary);
        }

        .nav-links i { margin-right: 10px; width: 20px; }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
        }

        /* Tables & UI Components */
        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; color: var(--text); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th { background-color: #fcfcfc; font-weight: 600; color: #666; }

        tr:hover { background-color: #fbfbfb; }

        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: inline-block;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">GEMINI CRM</div>
        <ul class="nav-links">
            <li><a href="leads.html"><i class="fas fa-users"></i> Ліди</a></li>
            <li><a href="managers.html"><i class="fas fa-user-tie"></i> Менеджери</a></li>
            <li><a href="formscreated.html"><i class="fas fa-file-alt"></i> Форми</a></li>
        </ul>
    </div>

    <div class="main-content">
        </div>
</body>
</html>
